# Deploys to Vercel with the Vercel CLI (the repo is NOT connected to Vercel's Git integration).
# Pattern: https://vercel.com/guides/how-can-i-use-github-actions-with-vercel
#   PR          -> preview deployment, URL commented on the PR
#   push main   -> production deployment
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID. App env vars live in the Vercel project.
#
# The Vercel team is on Hobby, which blocks any deployment whose git commit author isn't a team
# member, and `vercel deploy` then waits forever instead of failing. crh78 is the only member, so:
#   - previews only run for PRs opened by crh78 (everyone else relies on CI)
#   - production fails fast unless the commit on main is authored by crh78; merge other people's
#     PRs with "Create a merge commit" (not squash/rebase) so the merge commit is crh78's
#   - timeout-minutes backstops any other hang
# If the team moves to Pro and adds everyone, delete these guards.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_CLI_VERSION: 64.3.1

jobs:
  preview:
    name: preview
    # Fork PRs don't get secrets, so skip them. Non-members' PRs would be blocked by Vercel (see top).
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == 'crh78'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}
      - run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
      - run: vercel build --token=$VERCEL_TOKEN
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- vercel-preview -->";
            const body = `${marker}\n**Vercel preview:** ${process.env.PREVIEW_URL}\n\nCommit: ${context.payload.pull_request.head.sha.slice(0, 7)}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  production:
    name: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Check commit author is on the Vercel team
        env:
          AUTHOR: ${{ github.event.head_commit.author.username }}
        run: |
          if [ "$AUTHOR" != "crh78" ]; then
            echo "::error::Commit on main is authored by '${AUTHOR:-unknown}', who isn't on the Vercel Hobby team, so Vercel would block this deploy. Merge PRs with 'Create a merge commit' (by crh78), or push an empty commit as crh78 to redeploy."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}
      - run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - run: vercel build --prod --token=$VERCEL_TOKEN
      - run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
